<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — GetSetPrint</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html">
    <svg viewBox="0 0 32 32" width="30" height="30">
      <rect x="4" y="14" width="14" height="14" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <rect x="12" y="6" width="14" height="14" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>
    </svg>
    <span class="display" style="color:var(--ink);">GetSetPrint</span>
  </a>
  <div style="display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ink-soft)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    Secure Checkout
  </div>
</header>

<section style="padding:36px 56px 64px;max-width:1200px;margin:0 auto;">
  <h1 id="cartTitle" style="font-size:26px;font-weight:700;margin-bottom:28px;">Your Cart</h1>

  <div style="display:grid;grid-template-columns:minmax(300px,1.6fr) minmax(260px,1fr);gap:48px;align-items:start;">

    <!-- items -->
    <div>
      <div id="itemsList"></div>
      <div id="emptyState" style="padding:48px 0;text-align:center;color:var(--ink-faint);display:none;">
        Your cart is empty. <a href="index.html">Continue shopping →</a>
      </div>

      <div style="display:flex;gap:10px;margin-top:24px;">
        <input type="text" placeholder="Promo code" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:12px 16px;font-size:13.5px;color:var(--ink);background:var(--card);">
        <button type="button" style="border:1.5px solid var(--ink);border-radius:8px;padding:12px 22px;font-weight:600;font-size:13.5px;">Apply</button>
      </div>
    </div>

    <!-- summary -->
    <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:16px;">
      <span style="font-size:15px;font-weight:600;">Order Summary</span>
      <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);">
        <span>Subtotal</span><span id="subtotal" style="color:var(--ink);">&#8377;0</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);">
        <span>Shipping</span><span id="shipping" style="color:var(--ink);">&mdash;</span>
      </div>
      <div style="border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;font-size:16.5px;font-weight:700;">
        <span>Total</span><span id="total">&#8377;0</span>
      </div>
      <button id="checkoutBtn" class="btn-primary" style="margin-top:6px;">Proceed to Checkout</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;">
        <span style="font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink-faint);">UPI</span>
        <span style="font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink-faint);">Cards</span>
        <span style="font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink-faint);">Netbanking</span>
        <span style="font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink-faint);">COD</span>
      </div>
      <p style="font-size:12px;color:var(--ink-faint);margin-top:2px;">7-day return if damaged in transit &middot; Secure payments</p>
    </div>

  </div>
</section>

<script src="cart-store.js"></script>
<script>
(function () {
  var Cart = window.GetSetPrintCart;
  var fmt = Cart.fmt;

  // Seed a sample cart the first time this page is opened with nothing stored,
  // so the page has something to show. Remove this block once real
  // add-to-cart traffic is flowing.
  if (Cart.read().length === 0 && !window.localStorage.getItem('getsetprint_cart_seeded')) {
    Cart.write([
      { id: 'wyrmling-dragon', name: 'Wyrmling Dragon', variant: 'Sunset Orange · PLA+ · Medium', hex: '#c2571f', unitPrice: 1099, qty: 1 },
      { id: 'hex-planter-trio', name: 'Hex Planter Trio', variant: 'Forest Green · PETG', hex: '#2f6b4f', unitPrice: 649, qty: 2 },
      { id: 'fold-phone-stand', name: 'Fold Phone Stand', variant: 'Slate Grey · PLA+', hex: '#6b7280', unitPrice: 349, qty: 1 },
    ]);
    window.localStorage.setItem('getsetprint_cart_seeded', '1');
  }

  var itemsList = document.getElementById('itemsList');
  var emptyState = document.getElementById('emptyState');
  var cartTitle = document.getElementById('cartTitle');
  var subtotalEl = document.getElementById('subtotal');
  var shippingEl = document.getElementById('shipping');
  var totalEl = document.getElementById('total');
  var checkoutBtn = document.getElementById('checkoutBtn');

  function softTint(hex) {
    // light tinted swatch backdrop behind each item's colour dot
    return hex + '22';
  }

  function updateQty(index, delta) {
    var items = Cart.read();
    items[index].qty = Math.max(1, items[index].qty + delta);
    Cart.write(items);
    render();
  }

  function removeItem(index) {
    var items = Cart.read();
    items.splice(index, 1);
    Cart.write(items);
    render();
  }

  function render() {
    var items = Cart.read();
    itemsList.innerHTML = '';
    emptyState.style.display = items.length === 0 ? 'block' : 'none';

    var itemCount = items.reduce(function (sum, it) { return sum + it.qty; }, 0);
    cartTitle.textContent = 'Your Cart (' + itemCount + ' item' + (itemCount === 1 ? '' : 's') + ')';

    items.forEach(function (item, index) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;';
      row.innerHTML =
        '<div style="width:76px;height:76px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background-color:' + softTint(item.hex) + ';">' +
          '<div style="width:30px;height:30px;border-radius:50%;background-color:' + item.hex + ';"></div>' +
        '</div>' +
        '<div style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px;">' +
          '<span style="font-weight:600;font-size:15px;">' + item.name + '</span>' +
          '<span style="font-size:13px;color:var(--ink-faint);">' + item.variant + '</span>' +
          '<button type="button" data-remove style="width:fit-content;font-size:12.5px;color:var(--ink-faint);text-decoration:underline;margin-top:4px;">Remove</button>' +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" data-dec>&minus;</button>' +
          '<span>' + item.qty + '</span>' +
          '<button type="button" data-inc>+</button>' +
        '</div>' +
        '<span style="font-weight:600;font-size:15px;min-width:80px;text-align:right;">₹' + fmt(item.unitPrice * item.qty) + '</span>';

      row.querySelector('[data-dec]').addEventListener('click', function () { updateQty(index, -1); });
      row.querySelector('[data-inc]').addEventListener('click', function () { updateQty(index, 1); });
      row.querySelector('[data-remove]').addEventListener('click', function () { removeItem(index); });
      itemsList.appendChild(row);
    });

    var subtotal = items.reduce(function (sum, it) { return sum + it.unitPrice * it.qty; }, 0);
    var shipping = subtotal === 0 ? 0 : subtotal >= 999 ? 0 : 99;
    var total = subtotal + shipping;

    subtotalEl.textContent = '₹' + fmt(subtotal);
    shippingEl.textContent = subtotal === 0 ? '—' : shipping === 0 ? 'Free' : '₹' + fmt(shipping);
    totalEl.textContent = '₹' + fmt(total);
    checkoutBtn.disabled = items.length === 0;

    Cart.updateBadge();
  }

  checkoutBtn.addEventListener('click', function () {
    alert('This is a design mockup — no payment gateway is connected yet. Wire this button up to Razorpay, Stripe, or your payment provider of choice to accept real orders.');
  });

  render();
})();
</script>
</body>
</html>
