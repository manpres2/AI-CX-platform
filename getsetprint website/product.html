<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — GetSetPrint</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html">
    <svg viewBox="0 0 32 32" width="30" height="30">
      <rect x="4" y="14" width="14" height="14" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <rect x="12" y="6" width="14" height="14" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>
    </svg>
    <span class="display" style="color:var(--ink);">GetSetPrint</span>
  </a>
  <a class="btn-ghost" href="cart.html" style="position:relative;display:inline-flex;" aria-label="Cart">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17.5" cy="20.5" r="1.3"/></svg>
    <span class="cart-badge" data-cart-badge style="display:none;">0</span>
  </a>
</header>

<div id="breadcrumb" style="padding:20px 56px 0;max-width:1300px;margin:0 auto;font-size:13px;color:var(--ink-faint);"></div>

<section style="display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:24px 56px 48px;max-width:1300px;margin:0 auto;">
  <div style="min-width:0;">

    <!-- gallery -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div id="heroImage" class="layer-tex" style="height:440px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;"></div>
      <div style="display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:12px;">
        <div class="layer-tex" style="height:88px;border-radius:10px;background-color:var(--accent-soft);border:2px solid var(--ink);"></div>
        <div class="layer-tex" style="height:88px;border-radius:10px;background-color:var(--bg-alt);border:1px solid var(--line);"></div>
        <div class="layer-tex" style="height:88px;border-radius:10px;background-color:var(--accent2-soft);border:1px solid var(--line);"></div>
        <div class="layer-tex" style="height:88px;border-radius:10px;background-color:var(--bg-alt);border:1px solid var(--line);"></div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:20px;min-width:0;">
    <div style="display:flex;flex-direction:column;gap:10px;">
      <h1 id="productName" style="font-size:28px;font-weight:700;"></h1>
      <p id="productTagline" style="color:var(--ink-soft);font-size:14.5px;"></p>
      <div style="display:flex;align-items:center;gap:8px;">
        <div id="ratingStars" style="display:flex;gap:2px;"></div>
        <span id="reviewCount" style="font-size:13px;color:var(--ink-faint);"></span>
      </div>
    </div>

    <div id="price" style="font-size:26px;font-weight:700;"></div>

    <p id="productDescription" style="font-size:14.5px;color:var(--ink-soft);"></p>

    <!-- color -->
    <div id="colorSection" style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:13px;font-weight:600;">Colour &mdash; <span id="colorName" style="font-weight:400;color:var(--ink-soft);"></span></span>
      <div id="colorGroup" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    </div>

    <!-- material -->
    <div id="materialSection" style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:13px;font-weight:600;">Material</span>
      <div id="materialGroup" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    </div>

    <!-- size -->
    <div id="sizeSection" style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:13px;font-weight:600;">Size</span>
      <div id="sizeGroup" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    </div>

    <!-- qty + add to cart -->
    <div style="display:flex;gap:14px;align-items:stretch;margin-top:4px;flex-wrap:wrap;">
      <div class="stepper">
        <button id="qtyDec" type="button">&minus;</button>
        <span id="qtyValue">1</span>
        <button id="qtyInc" type="button">+</button>
      </div>
      <button id="addToCartBtn" class="btn-primary" style="flex:1;min-width:200px;">Add to cart</button>
    </div>
    <button class="btn-secondary">Buy it now</button>

    <p style="font-size:13px;color:var(--ink-faint);">Ships in 3&ndash;5 days &middot; Free shipping over &#8377;999</p>

    <!-- print specs -->
    <div style="border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:8px;">
      <span style="font-size:13.5px;font-weight:600;">Print specs</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13.5px;color:var(--ink-soft);">
        <span>Layer height</span><span style="color:var(--ink);">0.2 mm</span>
        <span>Infill</span><span style="color:var(--ink);">15%</span>
        <span>Supports needed</span><span style="color:var(--ink);">No</span>
        <span>Assembly</span><span style="color:var(--ink);">Not required</span>
      </div>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:6px;">
      <span style="font-size:13.5px;font-weight:600;">Care &amp; details</span>
      <p style="font-size:13.5px;color:var(--ink-soft);">FDM printed in PLA+. Hand wash only &mdash; avoid long direct sunlight to prevent warping.</p>
    </div>
  </div>
</section>

<!-- related -->
<section style="padding:32px 56px 64px;max-width:1300px;margin:0 auto;border-top:1px solid var(--line);">
  <h2 style="font-size:20px;font-weight:700;margin-bottom:22px;">You may also like</h2>
  <div id="relatedGrid" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(240px,1fr));gap:24px;"></div>
</section>

<script src="cart-store.js"></script>
<script src="products-store.js"></script>
<script>
(function () {
  var fmt = window.GetSetPrintCart.fmt;
  var Products = window.GetSetPrintProducts;

  var productId = new URLSearchParams(window.location.search).get('id');

  Products.all().then(function (all) {
    var product = all.find(function (p) { return p.id === productId; });
    if (!product) {
      window.location.href = 'index.html';
      return;
    }
    init(product, all);
  });

  function init(product, all) {
    document.title = product.name + ' — GetSetPrint';

    document.getElementById('breadcrumb').innerHTML =
      '<a href="index.html" style="color:var(--ink-faint);">Home</a> / ' +
      '<a href="index.html" style="color:var(--ink-faint);">' + product.category + '</a> / ' +
      '<span style="color:var(--ink-soft);">' + product.name + '</span>';

    document.getElementById('heroImage').style.backgroundColor = 'var(' + product.bg + ')';
    document.getElementById('heroImage').innerHTML = Products.thumbHtml(product, 190);

    document.getElementById('productName').textContent = product.name;
    document.getElementById('productTagline').textContent = product.tagline;
    document.getElementById('productDescription').textContent = product.description;

    var starSvg = '<svg viewBox="0 0 24 24" width="13" height="13" fill="var(--accent)"><path d="M12 2.5l2.9 6.1 6.6.7-4.9 4.5 1.3 6.6-5.9-3.3-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.7z"/></svg>';
    document.getElementById('ratingStars').innerHTML = starSvg.repeat(Math.round(product.rating));
    document.getElementById('reviewCount').textContent = product.rating + ' (' + product.reviews + ' reviews)';

    var hasColors = Array.isArray(product.colors) && product.colors.length > 0;
    var hasMaterials = Array.isArray(product.materials) && product.materials.length > 0;
    var hasSizes = Array.isArray(product.sizes) && product.sizes.length > 0;
    document.getElementById('colorSection').style.display = hasColors ? '' : 'none';
    document.getElementById('materialSection').style.display = hasMaterials ? '' : 'none';
    document.getElementById('sizeSection').style.display = hasSizes ? '' : 'none';

    var state = {
      color: hasColors ? product.colors[0].name : null,
      material: hasMaterials ? product.materials[0].key : null,
      size: hasSizes ? product.sizes[0].key : null,
      qty: 1,
      added: false,
    };

    var colorGroup = document.getElementById('colorGroup');
    var materialGroup = document.getElementById('materialGroup');
    var sizeGroup = document.getElementById('sizeGroup');
    var colorNameEl = document.getElementById('colorName');
    var priceEl = document.getElementById('price');
    var qtyValueEl = document.getElementById('qtyValue');
    var addBtn = document.getElementById('addToCartBtn');

    (product.colors || []).forEach(function (c) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch';
      btn.title = c.name;
      btn.style.backgroundColor = c.hex;
      btn.addEventListener('click', function () {
        state.color = c.name;
        state.added = false;
        render();
      });
      colorGroup.appendChild(btn);
    });

    (product.materials || []).forEach(function (m) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-pill';
      btn.textContent = m.label;
      btn.addEventListener('click', function () {
        state.material = m.key;
        state.added = false;
        render();
      });
      materialGroup.appendChild(btn);
    });

    (product.sizes || []).forEach(function (s) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-pill';
      btn.textContent = s.label;
      btn.addEventListener('click', function () {
        state.size = s.key;
        state.added = false;
        render();
      });
      sizeGroup.appendChild(btn);
    });

    document.getElementById('qtyDec').addEventListener('click', function () {
      state.qty = Math.max(1, state.qty - 1);
      state.added = false;
      render();
    });
    document.getElementById('qtyInc').addEventListener('click', function () {
      state.qty += 1;
      state.added = false;
      render();
    });

    function unitPrice() {
      var base = hasSizes
        ? product.sizes.find(function (s) { return s.key === state.size; }).price
        : product.price;
      var surcharge = hasMaterials
        ? product.materials.find(function (m) { return m.key === state.material; }).surcharge
        : 0;
      return base + surcharge;
    }

    addBtn.addEventListener('click', function () {
      var variantParts = [];
      if (hasColors) variantParts.push(state.color);
      if (hasMaterials) variantParts.push(state.material);
      if (hasSizes) variantParts.push(state.size);
      window.GetSetPrintCart.add({
        id: product.id,
        name: product.name,
        variant: variantParts.join(' · ') || 'Standard',
        hex: hasColors ? product.colors.find(function (c) { return c.name === state.color; }).hex : '#c2571f',
        unitPrice: unitPrice(),
        qty: state.qty,
      });
      state.added = true;
      render();
    });

    function render() {
      if (hasColors) colorNameEl.textContent = state.color;
      priceEl.textContent = '₹' + fmt(unitPrice());
      qtyValueEl.textContent = state.qty;

      Array.prototype.forEach.call(colorGroup.children, function (el, i) {
        el.classList.toggle('selected', product.colors[i].name === state.color);
      });
      Array.prototype.forEach.call(materialGroup.children, function (el, i) {
        el.classList.toggle('selected', product.materials[i].key === state.material);
      });
      Array.prototype.forEach.call(sizeGroup.children, function (el, i) {
        el.classList.toggle('selected', product.sizes[i].key === state.size);
      });

      addBtn.textContent = state.added
        ? 'Added to cart ✓'
        : 'Add to cart — ₹' + fmt(unitPrice() * state.qty);
    }

    render();
    renderRelated(product, all);
  }

  function renderRelated(product, all) {
    var others = all.filter(function (p) { return p.id !== product.id; });
    var picks = others.sort(function () { return Math.random() - 0.5; }).slice(0, 3);
    document.getElementById('relatedGrid').innerHTML = picks.map(function (p) {
      return (
        '<a class="product-card" href="product.html?id=' + p.id + '">' +
          '<div class="thumb layer-tex" style="height:170px;background-color:var(' + p.bg + ');">' +
            Products.thumbHtml(p, 56) +
          '</div>' +
          '<div class="info" style="padding:14px 16px 16px;">' +
            '<h3 style="font-size:14.5px;font-weight:600;">' + p.name + '</h3>' +
            '<span style="font-weight:600;font-size:14px;">₹' + fmt(p.price) + '</span>' +
          '</div>' +
        '</a>'
      );
    }).join('');
  }
})();
</script>
</body>
</html>
